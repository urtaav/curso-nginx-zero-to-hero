server {
    listen 80;
    server_name cache.miproyecto.local;

    access_log /var/log/nginx/cache-access.log especial;
    error_log /var/log/nginx/cache-error.log info;

    location /productos/ {
        limit_req zone=zona_cache burst=30 nodelay;

        # Activar caché
        proxy_cache cache_productos;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_valid 500 5s;
        
        # Llave de caché basada en URI y query string
        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Indicadores de caché en respuesta
        add_header X-Cache-Status $upstream_cache_status;

        # Cachear errores también (Gateway Timeout)
        proxy_cache_background_update on;
        proxy_cache_lock on;

        proxy_pass http://cluster_spring_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /productos/static/ {
        # Caché largo para contenido estático del backend
        proxy_cache cache_productos;
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 5m;
        
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://cluster_spring_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Endpoint para invalidar caché manualmente
    location /purge/ {
        proxy_cache_bypass $cookie_nocache;
        proxy_pass http://cluster_spring_backend;
    }

    location /health {
        return 200 '{"status":"ok","mode":"cache"}';
        add_header Content-Type application/json;
    }
}
