server {
    listen 80;
    server_name api.miproyecto.local;

    location /productos/ {
        # Aplicar rate limiting con burst de 20 peticiones extras
        limit_req zone=zona_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://cluster_spring_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Backend-Server $upstream_addr;
    }

    location /buscar/ {
        # Rate limiting más estricto
        limit_req zone=zona_buscar burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://cluster_spring_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Backend-Server $upstream_addr;
    }

    location /sin-limite/ {
        # Ruta sin rate limit para comparar
        proxy_pass http://cluster_spring_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Backend-Server $upstream_addr;
    }

    location /health {
        return 200 '{"status":"ok","domain":"api"}';
        add_header Content-Type application/json;
    }

    error_page 429 = @rate_limit_excedido;
    location @rate_limit_excedido {
        return 429 '{"error":"Demasiadas peticiones","retry_after":1}';
        add_header Content-Type application/json;
    }
}
