<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso Nginx 2026</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #181c25;
            --accent: #00c853;
            --accent-soft: #69f0ae;
            --text-main: #ffffff;
            --text-muted: #a0a6b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 20%, #1b2230 0%, #0f1117 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        /* Estrellas sutiles */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 45px 45px;
            opacity: 0.04;
            animation: moveStars 150s linear infinite;
        }

        @keyframes moveStars {
            from { transform: translate(0, 0); }
            to { transform: translate(-600px, -600px); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(24, 28, 37, 0.85);
            padding: 3rem 4rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(0, 200, 83, 0.08);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--accent-soft);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .highlight {
            color: var(--accent);
            text-shadow: 0 0 15px rgba(0, 200, 83, 0.4);
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .status {
            margin-top: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--accent-soft);
        }

        .dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="badge">DEV SERVER 2026</div>
        <h1>
            ¡<span class="highlight">Nginx</span> funcionando en Docker!
        </h1>
        <p>Tu contenedor está corriendo correctamente y el servidor está activo.</p>

        <div class="status">
            <div class="dot"></div>
            Server Online
        </div>
    </div>
</body>
</html>
