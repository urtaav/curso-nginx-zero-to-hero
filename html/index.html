<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard de Microservicios</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f4f4f4;
                padding: 20px;
            }
            .card {
                background: white;
                padding: 15px;
                margin: 10px 0;
                border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
            h2 {
                color: #333;
            }
            ul {
                list-style: none;
                padding: 0;
            }
            li {
                background: #eee;
                margin: 5px 0;
                padding: 10px;
                border-radius: 4px;
                font-family: monospace;
            }
        </style>
    </head>
    <body>
        <h1>Consola de Administración (Proxy Inverso)</h1>

        <div class="card">
            <h2>Usuarios desde Microservicio</h2>
            <ul id="lista-usuarios">
                Cargando...
            </ul>
        </div>

        <div class="card">
            <h2>Productos desde Microservicio</h2>
            <ul id="lista-productos">
                Cargando...
            </ul>
        </div>

        <script>
            // Función para obtener datos de las rutas del Proxy
            async function cargarDatos(url, elementId) {
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    document.getElementById(elementId).innerHTML =
                        `<li>${JSON.stringify(data)}</li>`;
                } catch (error) {
                    document.getElementById(elementId).innerHTML =
                        `<li style="color:red">Error: ${error}</li>`;
                }
            }

            // Llamamos a las rutas que configuramos en NGINX
            cargarDatos("/api/users", "lista-usuarios");
            cargarDatos("/api/products", "lista-productos");
        </script>
    </body>
</html>
