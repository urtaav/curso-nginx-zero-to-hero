services:
  servidor-practica:        # Este es el nombre del servicio
    image: nginx:latest     # La imagen oficial
    container_name: my-nginx-container # El nombre del contenedor
    ports:
      - "8181:80"           # Puerto local : Puerto del contenedor
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./conf:/etc/nginx/conf.d:ro       # Aquí van los archivos de sitios (solo bloques server)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Este es el archivo maestro (fuera de conf.d)
      - ./logs:/var/log/nginx


      